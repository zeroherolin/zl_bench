# Tool configuration only: zl_bench is a set of scripts and pytest plugins,
# not an installable package.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
